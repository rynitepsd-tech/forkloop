name: forkloop offline tests

on:
  push:
    paths: ["projects/forkloop/**", ".github/workflows/forkloop-tests.yml"]
  pull_request:
    paths: ["projects/forkloop/**", ".github/workflows/forkloop-tests.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/forkloop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/forkloop/pyproject.toml
      - run: pip install '.[dev,world]'
      # Offline only: no Solari, model or GPU credentials exist in this job.
      - run: python -m pytest -o faulthandler_timeout=120
      - name: consumer smoke
        run: |
          forkloop doctor --backend fake
          forkloop demo --out "$RUNNER_TEMP/demo"
          forkloop compare --config configs/offline-comparison.yaml --out "$RUNNER_TEMP/cmp"
          forkloop compare --config configs/custom-agent.yaml --out "$RUNNER_TEMP/custom"
