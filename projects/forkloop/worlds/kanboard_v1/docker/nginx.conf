# kanboard-v1: the official kanboard/kanboard image's server block (HTTP only), for Ubuntu's nginx + php8.1-fpm.
server {
    listen 80 default_server;
    server_name localhost;
    index index.php;
    root /var/www/app;
    client_max_body_size 32M;
    # every request, one line (diagnostics only: the oracle does not read it)
    access_log /var/log/nginx/kanboard-access.log;
    error_log /var/log/nginx/kanboard-error.log;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }
    location ~ ^/(index|jsonrpc|healthcheck)\.php(/|$) {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SERVER_NAME $host;
    }
    location ~ ^/(app|libs|vendor|data)/ { return 404; }
    location ~ ^/cli$ { return 404; }
    location ~ \.php$ { return 404; }
    location ~* \.(log|sqlite)$ { return 404; }
    location ~ /\. { return 404; }
    location ~* ^.+\.(ico|jpg|gif|png|css|js|svg|eot|ttf|woff|woff2|otf)$ {
        log_not_found off;
        expires 7d;
        etag on;
    }
}
