; kanboard-v1 php-fpm pool. Workers run as root (php-fpm -R), like the controller's sqlite3 over the agent
; channel, so neither side can leave a journal file the other may not open.
[www]
user = root
group = root
listen = /run/php/php8.1-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = static
pm.max_children = 8
clear_env = no
catch_workers_output = yes
