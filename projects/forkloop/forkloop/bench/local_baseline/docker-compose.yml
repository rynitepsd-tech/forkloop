# Local full-state-restore baseline for Chart 2 (see README.md).
# Same three pieces of state the Solari golden snapshot holds:
#   OpenEMR 8.3.0 (pinned build) + MariaDB, the FastAPI/SQLite payer portal,
#   and a Chrome profile directory (restored on the host, see restore.sh).
#
# Image tag verified on Docker Hub 2026-09-01:
#   https://hub.docker.com/r/openemr/openemr/tags  -> 8.3.0-2026-08-30 (date-stamped build of 8.3.0)
#   (7.0.3 does not exist there; 7.0.4 and 8.3.0 do.)

services:
  mysql:
    image: mariadb:10.11
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    environment:
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-uroot", "-proot", "--silent"]
      interval: 2s
      timeout: 3s
      retries: 60

  openemr:
    image: openemr/openemr:8.3.0-2026-08-30
    ports:
      - "8300:80"
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASS: root
      MYSQL_USER: openemr
      MYSQL_PASS: openemr
      OE_USER: admin
      OE_PASS: pass
    volumes:
      - openemr-sites:/var/www/localhost/htdocs/openemr/sites
      - openemr-logs:/var/log/apache2
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost/interface/login/login.php?site=default' >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 100

  portal:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORTAL_DB: /data/portal.db
      PORTAL_UPLOADS: /data/uploads
      PORTAL_PORT: "8080"
    volumes:
      - portal-data:/data
      # The portal package from the repo, read-only. Path is relative to this file.
      - ../../../worlds/claims_ops_v1/portal:/app/portal:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz', timeout=2).status==200 else 1)\""]
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  dbdata:
  openemr-sites:
  openemr-logs:
  portal-data:
