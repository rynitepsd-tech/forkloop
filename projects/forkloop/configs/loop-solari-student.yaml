# Flagship on Solari: the open-weight student (served by vLLM on the Lambda box, reached through an
# SSH tunnel on 127.0.0.1:18000) attempts real workflows; its failures are repaired from provider
# VM snapshots by the gpt-5.6-luna teacher under the same explicit-memory observation contract.
version: 1
world: claims-ops-v1
backend: solari
store: ../runs/loop-solari-student/forkloop.sqlite
budget: {max_steps: 90, max_seconds: 1500}
history_k: 12
settle: stable
checkpoints: {strategy: snapshot, every: 8, before_types: true, before_keys: [Return], max_snapshots: 5}
concurrency: 2
infra_retries: 1
student:
  name: qwen3.8-27b student (base)
  policy: student
  system_prompt_file: ../forkloop/policies/prompts/agent_memory_v2.md
  options:
    base_url: http://127.0.0.1:18000/v1
    model: qwen3.8-27b
    prompt_style: compact
    coord_space: norm1000
    image_max_side: 1920
    image_scale: 1.5
    history_k: 12
    prev_screenshot: true
    memory: true
    temperature: 0.0
    max_tokens: 384
    timeout_s: 120
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
teacher:
  name: gpt-5.6-luna teacher
  policy: student
  system_prompt_file: ../forkloop/policies/prompts/agent_memory_v2.md
  options:
    base_url: https://api.openai.com/v1
    model: gpt-5.6-luna
    prompt_style: compact
    image_max_side: 1280
    image_detail: high
    history_k: 12
    prev_screenshot: true
    memory: true
    hosted_reasoning: true
    max_tokens: 4096
    timeout_s: 120
    extra_body: {reasoning_effort: high}
repair: {k: 2, max_restart_points: 2, concurrency: 2, settle: stable, max_screen_distance: 0.10, restore_retries: 3}
