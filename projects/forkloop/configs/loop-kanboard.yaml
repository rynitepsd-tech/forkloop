# Correction loop on the second world (kanboard-v1: Kanboard v1.2.54 in Docker, docs/second-world.md).
# The student is a deliberately weak hosted agent (gpt-6-luna, low image detail, low reasoning effort); the
# teacher is gpt-5.6-luna with the same prompt and explicit-memory contract. Both call OpenAI through the
# guarded route: export OPENAI_API_KEY and FORKLOOP_SESSION_LEDGER (forkloop ledger ... --create).
# Backend environment until the world-aware Docker hook lands (docs/second-world.md, "Backend hook"):
#   FORKLOOP_DOCKER_IMAGE=forkloop/kanboard-v1:1 FORKLOOP_DOCKER_SNAPSHOT_DB=none
version: 1
world: kanboard-v1
backend: docker
store: ../runs/loop-kanboard/forkloop.sqlite
budget: {max_steps: 40, max_seconds: 900}
history_k: 12
# replay checkpoints only: a Docker commit is a filesystem checkpoint that restarts Chrome (and loses the
# open page), while replaying the recorded prefix through the agent channel rebuilds the screen too
checkpoints: {strategy: replay, every: 4, before_types: true, before_keys: [Return], max_snapshots: 0}
concurrency: 3
infra_retries: 2
student:
  name: gpt-6-luna weak student
  policy: student
  system_prompt_file: ../forkloop/policies/prompts/agent_memory_v2.md
  options:
    base_url: https://api.openai.com/v1
    model: gpt-6-luna
    prompt_style: compact
    image_max_side: 1280
    image_detail: low
    history_k: 12
    prev_screenshot: true
    memory: true
    hosted_reasoning: true
    max_tokens: 2048
    timeout_s: 120
    extra_body: {reasoning_effort: low}
teacher:
  name: gpt-5.6-luna teacher
  policy: student
  system_prompt_file: ../forkloop/policies/prompts/agent_memory_v2.md
  options:
    base_url: https://api.openai.com/v1
    model: gpt-5.6-luna
    prompt_style: compact
    image_max_side: 1280
    image_detail: high
    history_k: 12
    prev_screenshot: true
    memory: true
    hosted_reasoning: true
    max_tokens: 4096
    timeout_s: 120
    extra_body: {reasoning_effort: medium}
repair: {k: 3, max_restart_points: 2, concurrency: 3, settle: stable, max_screen_distance: 0.10, restore_retries: 2}
