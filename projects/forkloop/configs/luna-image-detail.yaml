# Does a common cost cut, low screenshot detail, silently break a GUI agent? One variable: image_detail.
# Both arms run gpt-6-luna with the workflow v5 prompt and the "Luna workflow prompt v5" options of
# configs/denial-navigation.json. Offline, on 20 recorded authorization screens, gpt-5.6-luna typed the exact
# authorization 19/20 times at high detail vs 0/20 at low (docs/frozen-v3-evaluation-results.md).
# Pre-registered in docs/protocol-image-detail-live.md. API keys and the session ledger come from the environment.
version: 1
world: claims-ops-v1
backend: solari
family: resolve_denial
split: heldout_seeds
reset_mode: fork   # a fresh desktop per cell: no machine outlives FORKLOOP_SOLARI_MAX_LIFETIME_MIN
# Run 1 used 100300-100313 (a reset defect made the task infeasible; docs/live-image-detail-comparison.md).
seeds: [100314, 100315, 100316, 100317, 100318, 100319, 100320, 100321, 100322, 100323, 100324, 100325, 100326, 100327]
budget:
  max_steps: 120
  max_seconds: 1200
variants:
  - name: Luna high detail
    policy: student
    system_prompt_file: ../forkloop/policies/prompts/hosted_gui_agent_v5.md
    options: &luna
      base_url: https://api.openai.com/v1
      model: gpt-6-luna
      prompt_style: compact
      image_max_side: 1280
      image_detail: high
      history_k: 16
      prev_screenshot: true
      history_notes: false
      hosted_reasoning: true
      max_tokens: 4096
      timeout_s: 120
      extra_body:
        reasoning_effort: high
  - name: Luna low detail
    policy: student
    system_prompt_file: ../forkloop/policies/prompts/hosted_gui_agent_v5.md
    options:
      <<: *luna
      image_detail: low
