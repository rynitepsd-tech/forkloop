# A development experiment, not a held-out benchmark or a promised improvement.
# Only history_notes differs. API keys and the session ledger come from the environment.
version: 1
world: claims-ops-v1
backend: solari
family: resolve_denial
split: train
seeds: [200, 201, 202, 203]
budget:
  max_steps: 120
  max_seconds: 900
variants:
  - name: Luna without reasoning memory
    policy: student
    options:
      base_url: https://api.openai.com/v1
      model: gpt-5.6-luna
      prompt_style: compact
      image_max_side: 1280
      image_detail: high
      history_k: 16
      prev_screenshot: true
      history_notes: false
      hosted_reasoning: true
      max_tokens: 4096
      timeout_s: 120
      extra_body:
        reasoning_effort: high
  - name: Luna with reasoning memory
    policy: student
    options:
      base_url: https://api.openai.com/v1
      model: gpt-5.6-luna
      prompt_style: compact
      image_max_side: 1280
      image_detail: high
      history_k: 16
      prev_screenshot: true
      history_notes: true
      hosted_reasoning: true
      max_tokens: 4096
      timeout_s: 120
      extra_body:
        reasoning_effort: high
