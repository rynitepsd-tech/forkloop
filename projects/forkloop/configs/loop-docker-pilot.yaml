# Correction loop on the Docker world (one Lambda box runs worlds, the student server and training).
# Development/pilot configuration; the registered experiment copies it with frozen values.
version: 1
world: claims-ops-v1
backend: docker
store: /home/ubuntu/programs/pilot/forkloop.sqlite
budget: {max_steps: 120, max_seconds: 1800}
history_k: 12
checkpoints: {strategy: replay, every: 4, before_types: true, before_keys: [Return], max_snapshots: 0}
concurrency: 24
infra_retries: 2
student:
  name: student
  policy: student
  system_prompt_file: ../forkloop/policies/prompts/agent_memory_v2.md
  options:
    base_url: http://127.0.0.1:8000/v1
    model: qwen3.8-27b
    prompt_style: compact
    coord_space: norm1000
    image_max_side: 1280
    history_k: 12
    prev_screenshot: true
    memory: true
    temperature: 0.0
    max_tokens: 384
    timeout_s: 120
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
teacher:
  name: gpt-5.6-luna teacher
  policy: student
  system_prompt_file: ../forkloop/policies/prompts/agent_memory_v2.md
  options:
    base_url: https://api.openai.com/v1
    model: gpt-5.6-luna
    prompt_style: compact
    image_max_side: 1280
    image_detail: high
    history_k: 12
    prev_screenshot: true
    memory: true
    hosted_reasoning: true
    max_tokens: 4096
    timeout_s: 120
    extra_body: {reasoning_effort: high}
repair: {k: 3, max_restart_points: 2, concurrency: 24, settle: stable, max_screen_distance: 0.10, restore_retries: 2}
